name: Release

# Push a version tag to publish a release, e.g.:  git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $project = 'ScreenTranslator/ScreenTranslator.csproj'
          $singleFile = '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true'

          # Standalone: one .exe with .NET included, nothing else to install
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish $project -c Release -r $rid --self-contained true @singleFile -p:DebugType=none -p:Version=$version -o "out/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive "out/$rid/*" "ScreenTranslator-$version-$rid.zip"
          }

          # Smaller download for people who already have the .NET 10 Desktop Runtime
          dotnet publish $project -c Release -r win-x64 --self-contained false -p:DebugType=none -p:Version=$version -o out/framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive out/framework/* "ScreenTranslator-$version-win-x64-needs-dotnet10.zip"

          # Download guide and requirements go above GitHub's generated changelog
          (Get-Content .github/release-notes.md -Raw).Replace('{version}', $version) | Set-Content notes.md

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG (Get-ChildItem *.zip).FullName --title "ScreenTranslator $env:TAG" --notes-file notes.md --generate-notes
